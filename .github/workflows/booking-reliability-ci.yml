name: Booking reliability tests

on:
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate static website build
        run: node scripts/build.mjs
      - name: Offline unit and booking-notification security tests
        run: node --no-warnings --test tests/*.test.mjs
