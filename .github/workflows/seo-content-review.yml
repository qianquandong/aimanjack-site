name: Apply reviewed SEO content once

on:
  push:
    branches: [fix/seo-content-consistency-2026-10-13]

permissions:
  contents: read

jobs:
  apply-reviewed-content:
    if: github.ref == 'refs/heads/fix/seo-content-consistency-2026-10-13' && contains(github.event.head_commit.message, '[apply-reviewed-seo]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply and verify exact locally reviewed source bytes
        run: python3 .review/apply-seo-content.py
      - name: Install locked test dependencies
        run: npm ci --ignore-scripts
      - name: Build generated HTML from reviewed source
        run: node scripts/build.mjs
      - name: Complete offline regression suite
        shell: bash
        run: |
          set -euo pipefail
          node --no-warnings --test tests/*.test.mjs | tee /tmp/seo-review-tests.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seo-review-test-results
          path: /tmp/seo-review-tests.log
          retention-days: 7
      - name: Commit only approved content and generated pages to review branch
        shell: bash
        env:
          REVIEW_BRANCH: fix/seo-content-consistency-2026-10-13
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$REVIEW_BRANCH"
          python3 - <<'PY'
          import subprocess
          allowed = set('''src/training-buyers.mjs
          src/posts/ai-training-for-office-managers.mjs
          src/posts/ai-training-for-employees-start-with-one-task.mjs
          src/pages/zhguides.mjs
          src/pages/training.mjs
          src/pages/offers.mjs
          tests/site.test.mjs
          ai-training/index.html
          ai-training/team-workshop/index.html
          ai-training/onsite-texas/index.html
          blog/ai-training-for-office-managers/index.html
          blog/ai-training-for-employees-start-with-one-task/index.html
          zh/ai-training/index.html
          zh/ai-training/team-workshop/index.html
          zh/ai-training/onsite-texas/index.html
          zh/blog/ai-training-for-office-managers/index.html
          zh/blog/ai-training-for-employees-start-with-one-task/index.html
          zh/ai-peixun-shi/index.html
          zh/ai-peixun-najia-zuihao/index.html'''.splitlines())
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          assert changed and changed <= allowed, sorted(changed - allowed)
          subprocess.run(['git','add','--',*sorted(changed)], check=True)
          PY
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: align bilingual training content and clarify buyer questions'
          REMOTE_HEAD="$(git ls-remote origin "refs/heads/$REVIEW_BRANCH" | cut -f1)"
          test "$REMOTE_HEAD" = "$GITHUB_SHA"
          git push origin "HEAD:refs/heads/$REVIEW_BRANCH"
